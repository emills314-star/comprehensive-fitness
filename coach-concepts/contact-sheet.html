<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Coach concepts — contact sheet</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="palette.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--surface); color: var(--text); }
    body { font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; padding: 40px 44px 48px; width: 2000px; }
    h1 { margin: 0 0 4px; font-size: 40px; font-weight: 900; letter-spacing: -.03em; }
    p { margin: 0 0 28px; font-size: 18px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 28px 24px; }
    figure { margin: 0; }
    img { width: 100%; aspect-ratio: 390 / 844; display: block; border-radius: 22px; border: 1px solid var(--line); background: var(--bg); box-shadow: var(--el-2); }
    figcaption { margin-top: 10px; font-size: 20px; font-weight: 800; display: flex; gap: 10px; align-items: baseline; }
    figcaption span { color: var(--muted-2); font-weight: 700; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1 data-frame-title>The flag, ten ways</h1>
  <p>Bench set 2: 185 × 6 after a 1:32 rest, expected 8–9. Same palette, same numbers, ten different coaches. Open coach-concepts/index.html to see every screen.</p>
  <div class="grid">
    <figure><img src="shots/01-F2.png" alt=""><figcaption><span>01</span>Control Chart</figcaption></figure>
    <figure><img src="shots/02-F2.png" alt=""><figcaption><span>02</span>Earpiece</figcaption></figure>
    <figure><img src="shots/03-F2.png" alt=""><figcaption><span>03</span>Futures</figcaption></figure>
    <figure><img src="shots/04-F2.png" alt=""><figcaption><span>04</span>Sentence</figcaption></figure>
    <figure><img src="shots/05-F2.png" alt=""><figcaption><span>05</span>Ambient</figcaption></figure>
    <figure><img src="shots/06-F2.png" alt=""><figcaption><span>06</span>Hypothesis</figcaption></figure>
    <figure><img src="shots/07-F2.png" alt=""><figcaption><span>07</span>Instrument</figcaption></figure>
    <figure><img src="shots/08-F2.png" alt=""><figcaption><span>08</span>Lint</figcaption></figure>
    <figure><img src="shots/09-F2.png" alt=""><figcaption><span>09</span>Engine</figcaption></figure>
    <figure><img src="shots/10-F2.png" alt=""><figcaption><span>10</span>Loaded Bar</figcaption></figure>
  </div>
</body>
</html>
